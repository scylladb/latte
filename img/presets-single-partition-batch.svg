<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A batch of consecutive indexes spans four partitions and pays the batchlog, a batch built by get_partition_batch stays inside one partition and skips it.">
<style>.bgcard{fill:#f6f8fa;stroke:#d0d7de}.card{fill:#ffffff;stroke:#d0d7de}.b-blue{fill:#ddf4ff;stroke:#0969da}.b-red{fill:#ffebe9;stroke:#cf222e}.b-green{fill:#dafbe3;stroke:#1a7f37}.b-purple{fill:#fbefff;stroke:#8250df}.t-ink{fill:#1f2328}.t-muted{fill:#656d76}.t-blue{fill:#0969da}.t-red{fill:#cf222e}.t-green{fill:#1a7f37}.t-purple{fill:#8250df}.l-muted{stroke:#656d76}.l-green{stroke:#1a7f37}.l-red{stroke:#cf222e}.l-border{stroke:#d0d7de}.m-muted{fill:#656d76}.m-green{fill:#1a7f37}.m-red{fill:#cf222e}
@media (prefers-color-scheme:dark){.bgcard{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}.b-blue{fill:#121d2f;stroke:#58a6ff}.b-red{fill:#25171c;stroke:#f85149}.b-green{fill:#12261e;stroke:#3fb950}.b-purple{fill:#1d1b2e;stroke:#bc8cff}.t-ink{fill:#e6edf3}.t-muted{fill:#8b949e}.t-blue{fill:#58a6ff}.t-red{fill:#f85149}.t-green{fill:#3fb950}.t-purple{fill:#bc8cff}.l-muted{stroke:#8b949e}.l-green{stroke:#3fb950}.l-red{stroke:#f85149}.l-border{stroke:#30363d}.m-muted{fill:#8b949e}.m-green{fill:#3fb950}.m-red{fill:#f85149}}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-muted"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-green"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-red"/></marker></defs>
<rect class="bgcard" x="0.5" y="0.5" width="979" height="349" rx="8"/>
<text class="t-ink" x="28" y="36" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" font-weight="600">Why the batch must stay inside one partition</text>
<path class="l-border" d="M490.0 54 L490.0 330" fill="none" stroke-width="1" stroke-dasharray="4 4"/>
<text class="t-red" x="28" y="74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" font-weight="600">NAIVE: consecutive indexes in one batch</text>
<rect class="b-red" x="28" y="86" width="440.0" height="36" rx="5"/>
<text class="t-red" x="248.0" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">rows of idx 0, 1, 2, 3  -&gt;  4 different pk</text>
<path class="l-red" d="M248.0 124 L248.0 146" fill="none" stroke-width="1.3" marker-end="url(#ar)"/>
<rect class="card" x="168.0" y="148" width="160" height="32" rx="5"/>
<text class="t-ink" x="248.0" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">coordinator</text>
<path class="l-red" d="M248.0 182 L248.0 204" fill="none" stroke-width="1.3" marker-end="url(#ar)"/>
<rect class="b-red" x="28" y="206" width="440.0" height="32" rx="5"/>
<text class="t-red" x="248.0" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">batchlog write -&gt; 2 extra replicas</text>
<path class="l-red" d="M248.0 240 L248.0 262" fill="none" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t-muted" x="248.0" y="316" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="normal">a durable round trip before anything applies</text>
<text class="t-muted" x="248.0" y="334" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="normal">4 replica sets  ·  latency = the slowest one</text>
<text class="t-green" x="512.0" y="74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" font-weight="600">get_partition_batch: one partition per batch</text>
<rect class="b-green" x="512.0" y="86" width="440.0" height="36" rx="5"/>
<text class="t-green" x="732.0" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">rows of idx 0, 4, 8, 12  -&gt;  one pk</text>
<path class="l-green" d="M732.0 124 L732.0 146" fill="none" stroke-width="1.3" marker-end="url(#ag)"/>
<rect class="card" x="652.0" y="148" width="160" height="32" rx="5"/>
<text class="t-ink" x="732.0" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">coordinator</text>
<path class="l-green" d="M732.0 182 L732.0 204" fill="none" stroke-width="1.3" marker-end="url(#ag)"/>
<rect class="card" x="512.0" y="206" width="440.0" height="32" rx="5"/>
<text class="t-muted" x="732.0" y="227" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">batchlog skipped</text>
<path class="l-green" d="M732.0 240 L732.0 262" fill="none" stroke-width="1.3" marker-end="url(#ag)"/>
<text class="t-muted" x="732.0" y="316" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="normal">a single partition is already atomic</text>
<text class="t-muted" x="732.0" y="334" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="normal">1 replica set  ·  one round trip</text>
<rect class="card" x="28.0" y="264" width="102.5" height="32" rx="5"/>
<text class="t-ink" x="79.25" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">P0</text>
<rect class="card" x="140.5" y="264" width="102.5" height="32" rx="5"/>
<text class="t-ink" x="191.75" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">P1</text>
<rect class="card" x="253.0" y="264" width="102.5" height="32" rx="5"/>
<text class="t-ink" x="304.25" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">P2</text>
<rect class="card" x="365.5" y="264" width="102.5" height="32" rx="5"/>
<text class="t-ink" x="416.75" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">P3</text>
<rect class="b-green" x="642.0" y="264" width="180" height="32" rx="5"/>
<text class="t-green" x="732.0" y="285" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle" font-weight="normal">P0 replica set</text>
</svg>
